services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: shelfie
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    command: sh -c "composer install && php -S 0.0.0.0:8000 -t public"
    ports:
      - "8000:8000"
    environment:
      COMPOSER_ALLOW_SUPERUSER: 1
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://root:${DB_ROOT_PASSWORD}@database:3306/shelfie?serverVersion=8.4.0&charset=utf8mb4"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "9000:9000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules: